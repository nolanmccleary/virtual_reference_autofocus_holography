<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wi-Fi Holography — live simulator</title>
<style>
  :root {
    color-scheme: dark;
    --bg0:#0d1420; --bg1:#080b12;
    --panel:rgba(14,20,32,0.80); --panel-border:rgba(120,150,190,0.18);
    --text:#c9d4e4; --muted:#6b7a90;
    --cyan:#38e1d6; --cyan-dim:#2bb6cf; --amber:#ffb545; --amber-hot:#ff7a2f;
    --magenta:#ff5d9e; --steel:#9aa7bb;
    --font-sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    --font-mono:ui-monospace,"SF Mono","SFMono-Regular",Menlo,Consolas,monospace;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body {
    background:radial-gradient(130% 110% at 70% 15%,var(--bg0),var(--bg1) 70%);
    color:var(--text); font-family:var(--font-sans); overflow:hidden;
  }
  #stage { position:fixed; inset:0; }
  #view { display:block; width:100%; height:100%; cursor:grab; touch-action:none; }
  #view:active { cursor:grabbing; }
  .overlay { position:fixed; pointer-events:none; }

  .masthead { top:20px; left:24px; max-width:360px; z-index:5; }
  .eyebrow { font-family:var(--font-mono); font-size:10.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--cyan); margin:0 0 5px; }
  .masthead h1 { font-size:19px; font-weight:650; letter-spacing:-.01em; margin:0; line-height:1.15; text-wrap:balance; }
  .scene-row { pointer-events:auto; display:flex; align-items:center; gap:8px; margin-top:9px; }
  .scene-row label { font-family:var(--font-mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  select#scene {
    pointer-events:auto; font-family:var(--font-sans); font-size:12.5px; color:var(--text);
    background:var(--panel); border:1px solid var(--panel-border); border-radius:8px;
    padding:5px 9px; cursor:pointer; backdrop-filter:blur(14px);
  }
  select#scene:focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }
  .status { display:inline-flex; align-items:center; gap:6px; margin-top:8px; font-family:var(--font-mono); font-size:10.5px; color:var(--muted); }
  .status .dot { width:7px; height:7px; border-radius:50%; background:var(--cyan-dim); box-shadow:0 0 8px var(--cyan); transition:.2s; }
  .status .dot.busy { background:var(--amber); box-shadow:0 0 8px var(--amber); }

  .panel {
    pointer-events:auto; position:fixed; background:var(--panel);
    border:1px solid var(--panel-border); border-radius:12px; padding:14px 15px 15px;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    box-shadow:0 18px 50px -20px rgba(0,0,0,.7); overflow-y:auto;
  }
  .panel::-webkit-scrollbar { width:8px; }
  .panel::-webkit-scrollbar-thumb { background:rgba(120,150,190,.25); border-radius:4px; }
  .panel h2 { font-family:var(--font-mono); font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin:0 0 10px; font-weight:600; }
  .panel h2.mt { margin-top:16px; }

  .left { top:150px; left:24px; width:258px; max-height:calc(100vh - 172px); }
  .right { top:20px; right:22px; width:300px; max-height:calc(100vh - 42px); }

  .scanbtn { width:100%; padding:9px; border-radius:8px; background:var(--cyan); color:#061018; font-weight:650; border:none; cursor:pointer; font-size:13px; font-family:var(--font-sans); transition:.15s; }
  .scanbtn:hover { filter:brightness(1.08); }
  .scanbtn.stop { background:var(--magenta); color:#140208; }
  .progress { height:6px; background:rgba(120,150,190,.15); border-radius:3px; overflow:hidden; margin:10px 0 5px; }
  .progress .bar { height:100%; width:0%; background:var(--cyan); transition:width .08s linear; }
  .ptext { font-family:var(--font-mono); font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }

  .ctl { margin:9px 0; }
  .ctl .row { display:flex; justify-content:space-between; align-items:baseline; font-size:12px; margin-bottom:2px; }
  .ctl .row .name { color:var(--text); }
  .ctl .row .val { font-family:var(--font-mono); font-size:11.5px; color:var(--cyan); font-variant-numeric:tabular-nums; }
  input[type=range] { width:100%; accent-color:var(--cyan); cursor:pointer; margin:2px 0; }
  input[type=range]:disabled { accent-color:var(--muted); opacity:.5; cursor:default; }
  .lam { font-family:var(--font-mono); font-size:11px; color:var(--muted); margin-top:6px; }
  .lam b { color:var(--text); }
  .pgroup { margin-top:6px; }
  .pgroup .glabel { font-family:var(--font-mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:12px 0 2px; font-weight:600; }
  select.pselect { width:100%; margin-top:3px; font-family:var(--font-sans); font-size:12px; color:var(--text);
    background:rgba(120,150,190,.1); border:1px solid var(--panel-border); border-radius:7px; padding:5px 8px; cursor:pointer; text-transform:capitalize; }
  select.pselect:focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }

  .toggle { display:flex; align-items:center; gap:9px; font-size:12px; padding:3.5px 0; cursor:pointer; user-select:none; color:var(--text); }
  .toggle input { display:none; }
  .box { width:15px; height:15px; border-radius:4px; border:1.5px solid var(--panel-border); flex:none; display:grid; place-items:center; transition:.15s; }
  .box::after { content:""; width:7px; height:7px; border-radius:1.5px; background:var(--cyan); transform:scale(0); transition:transform .15s; box-shadow:0 0 8px var(--cyan); }
  .toggle input:checked + .box { border-color:var(--cyan); }
  .toggle input:checked + .box::after { transform:scale(1); }

  .recon-view { position:relative; width:100%; aspect-ratio:3/2; border-radius:8px; overflow:hidden; background:#05070c; border:1px solid var(--panel-border); }
  .recon-view img { width:100%; height:100%; display:block; image-rendering:auto; }
  .recon-view .tag { position:absolute; left:8px; top:7px; font-family:var(--font-mono); font-size:10.5px; color:var(--text); background:rgba(5,7,12,.6); padding:2px 7px; border-radius:5px; }
  .seg { display:flex; gap:4px; margin:11px 0 10px; }
  .seg button { flex:1; font-family:var(--font-sans); font-size:11.5px; color:var(--muted); background:rgba(120,150,190,.08); border:1px solid var(--panel-border); border-radius:7px; padding:6px 3px; cursor:pointer; transition:.15s; }
  .seg button:hover { color:var(--text); }
  .seg button[aria-pressed="true"] { color:#061018; background:var(--cyan); border-color:var(--cyan); font-weight:600; }
  .depth-row { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:3px; }
  .depth-row .lab { font-size:11px; color:var(--muted); font-family:var(--font-mono); letter-spacing:.08em; text-transform:uppercase; }
  .depth-row .zval { font-family:var(--font-mono); font-size:13px; color:var(--cyan); font-variant-numeric:tabular-nums; }
  .ticks { position:relative; height:13px; font-family:var(--font-mono); font-size:9px; color:var(--muted); }
  .ticks span { position:absolute; transform:translateX(-50%); white-space:nowrap; }
  #profile { width:100%; height:56px; display:block; margin-top:5px; }
  .thumbs { display:flex; gap:8px; }
  .thumb { flex:1; margin:0; }
  .thumb img { width:100%; border-radius:5px; border:1px solid var(--panel-border); display:block; background:#05070c; aspect-ratio:3/2; }
  .thumb figcaption { font-family:var(--font-mono); font-size:9.5px; color:var(--muted); margin:3px 0 0; text-align:center; }

  .hint { bottom:16px; left:24px; font-family:var(--font-mono); font-size:11px; color:var(--muted); }
  .hint kbd { background:rgba(120,150,190,.12); border:1px solid var(--panel-border); border-radius:4px; padding:1px 6px; font-family:inherit; color:var(--text); }

  @media (max-width:980px) {
    .left { display:none; } .hint { display:none; } .masthead { max-width:52%; }
    .right { top:auto; bottom:12px; right:12px; left:12px; width:auto; max-height:52vh; }
  }
</style>
</head>
<body>
<div id="stage"><canvas id="view"></canvas></div>

<div class="overlay masthead">
  <p class="eyebrow">Holography of Wi-Fi Radiation · PRL 118, 183901</p>
  <h1 id="sceneTitle">Live simulator</h1>
  <div class="scene-row">
    <label for="scene">Experiment</label>
    <select id="scene"></select>
  </div>
  <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">ready</span></div>
</div>

<div class="panel left">
  <h2>Scan</h2>
  <button class="scanbtn" id="scanBtn">Begin scan</button>
  <div class="progress"><div class="bar" id="scanBar"></div></div>
  <div class="ptext" id="scanText">0 / 0 points · idle</div>
  <div class="ctl" style="margin-top:11px">
    <div class="row"><span class="name">Scan time</span><span class="val" id="speedVal">8.0 s</span></div>
    <input type="range" id="speed" min="2" max="30" value="8" step="0.5">
  </div>

  <h2 class="mt">Parameters</h2>
  <div id="params"></div>
  <div class="lam">&lambda; = <b id="lamVal">—</b></div>
  <div class="lam">scan grid: <b id="ptsVal">—</b> pts</div>

  <h2 class="mt">Show</h2>
  <label class="toggle"><input type="checkbox" id="t-recon" checked><span class="box"></span>Reconstruction plane</label>
  <label class="toggle"><input type="checkbox" id="t-cone" checked><span class="box"></span>Illumination cone</label>
  <label class="toggle"><input type="checkbox" id="t-rays"><span class="box"></span>Shadow rays</label>
  <label class="toggle"><input type="checkbox" id="t-mesh"><span class="box"></span>Scan mesh</label>
  <label class="toggle"><input type="checkbox" id="t-grid" checked><span class="box"></span>Scan grid</label>
  <label class="toggle"><input type="checkbox" id="t-spin" checked><span class="box"></span>Auto-rotate</label>
</div>

<div class="panel right">
  <h2>Reconstruction</h2>
  <div class="recon-view">
    <img id="slice" alt="reconstructed intensity slice">
    <div class="tag" id="sliceTag">z = —</div>
  </div>
  <div class="seg" role="group" aria-label="mode">
    <button id="m-single" aria-pressed="true">Single f</button>
    <button id="m-white" aria-pressed="false">White-light</button>
    <button id="m-dark" aria-pressed="false">Dark-field</button>
  </div>
  <div class="depth-row"><span class="lab">Depth z</span><span class="zval" id="zval">—</span></div>
  <input type="range" id="depth" min="0" max="40" value="20" step="1">
  <div class="ticks" id="ticks"></div>
  <canvas id="profile"></canvas>
  <label class="toggle" style="margin-top:8px"><input type="checkbox" id="t-sharp"><span class="box" style="border-color:rgba(94,240,138,.6)"></span><span id="sharpLabel">Max sharpness</span><span class="val" id="sharpZval" style="margin-left:auto;color:#5ef08a"></span></label>
  <div id="sharpXY" style="display:none;font-family:var(--font-mono);font-size:10.5px;color:#5ef08a;margin:1px 0 0 24px"></div>

  <div id="holoSection">
    <h2 class="mt">Recorded hologram</h2>
    <div class="thumbs">
      <figure class="thumb"><img id="holoAmp" alt="hologram amplitude"><figcaption>amplitude</figcaption></figure>
      <figure class="thumb"><img id="holoPhase" alt="hologram phase"><figcaption>phase</figcaption></figure>
    </div>
  </div>
</div>

<div class="overlay hint"><kbd>drag</kbd> orbit · <kbd>scroll</kbd> zoom · <kbd>Begin scan</kbd> to acquire</div>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById("view");
  const ctx = canvas.getContext("2d");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const COL = { cyan:"#38e1d6", cyanDim:"#2bb6cf", amber:"#ffb545", magenta:"#ff5d9e", steel:"#9aa7bb", white:"#eaf2ff" };

  let S = null;              // server state
  let mode = "single", zIndex = 20, k = 0, profile = [];
  let sharpIdx = null, showSharp = false, sharpX = null, sharpY = null;
  let scanning = false, scanStart = 0, scanDur = 8.0, lastReq = 0;
  let schemaByKey = {}, PCTL = {}, curScene = null;
  let paramsDirty = false;   // backprojection scenes: params pending until Begin scan

  const $ = id => document.getElementById(id);
  const dot = $("statusDot"), statusText = $("statusText");
  function setStatus(t, busy){ statusText.textContent = t; dot.classList.toggle("busy", !!busy); }

  // ---------- value formatting ----------
  function fmtVal(p, v){
    v = +v;
    switch(p.fmt){
      case "ghz": return v.toFixed(1)+" GHz";
      case "mhz": return Math.round(v)+" MHz";
      case "int": return ""+Math.round(v);
      case "px":  return Math.round(v)+" px";
      case "m":   return v.toFixed(1)+" m";
      case "cm":  return Math.round(v)+" cm";
      case "num": return v.toFixed(2);
      default:    return ""+v;
    }
  }

  // ---------- dynamic parameter panel ----------
  let paramTimer = null;
  function buildParamPanel(schema){
    const host = $("params"); host.innerHTML = ""; PCTL = {}; schemaByKey = {};
    const groups = [];
    for(const p of schema){ schemaByKey[p.key] = p;
      let gr = groups.find(g=>g.name===p.group); if(!gr){ gr={name:p.group, items:[]}; groups.push(gr); } gr.items.push(p); }
    for(const gr of groups){
      const gl = document.createElement("div"); gl.className="glabel"; gl.textContent=gr.name; host.appendChild(gl);
      PCTL["__glabel_"+gr.name]={container:gl, group:true};
      for(const p of gr.items){
        if(p.kind==="toggle"){
          const lab=document.createElement("label"); lab.className="toggle";
          const inp=document.createElement("input"); inp.type="checkbox"; inp.id="p_"+p.key;
          const bx=document.createElement("span"); bx.className="box";
          lab.appendChild(inp); lab.appendChild(bx); lab.appendChild(document.createTextNode(p.label));
          host.appendChild(lab); PCTL[p.key]={el:inp, kind:"toggle", container:lab, show_if:p.show_if};
          inp.addEventListener("change", ()=>queueParamUpdate(true));
        } else if(p.kind==="select"){
          const ctl=document.createElement("div"); ctl.className="ctl";
          const row=document.createElement("div"); row.className="row";
          const nm=document.createElement("span"); nm.className="name"; nm.textContent=p.label;
          row.appendChild(nm); ctl.appendChild(row);
          const sel=document.createElement("select"); sel.id="p_"+p.key; sel.className="pselect";
          (p.options||[]).forEach(o=>{ const op=document.createElement("option"); op.value=o; op.textContent=o; sel.appendChild(op); });
          sel.value=p.default; ctl.appendChild(sel); host.appendChild(ctl);
          PCTL[p.key]={el:sel, kind:"select", container:ctl, show_if:p.show_if};
          sel.addEventListener("change", ()=>{ updateParamVisibility(); queueParamUpdate(true); });
        } else {
          const ctl=document.createElement("div"); ctl.className="ctl";
          const row=document.createElement("div"); row.className="row";
          const nm=document.createElement("span"); nm.className="name"; nm.textContent=p.label;
          const val=document.createElement("span"); val.className="val"; val.id="pv_"+p.key;
          row.appendChild(nm); row.appendChild(val);
          const inp=document.createElement("input"); inp.type="range"; inp.id="p_"+p.key;
          inp.min=p.min; inp.max=p.max; inp.step=p.step; inp.value=p.default;
          ctl.appendChild(row); ctl.appendChild(inp); host.appendChild(ctl);
          PCTL[p.key]={el:inp, valEl:val, kind:"slider", container:ctl, show_if:p.show_if};
          val.textContent = fmtVal(p, p.default);
          inp.addEventListener("input", ()=>{ liveLabel(p.key); queueParamUpdate(false); });
        }
      }
    }
    updateParamVisibility();
  }
  // show/hide controls whose show_if condition isn't met by the current values
  function updateParamVisibility(){
    for(const key in PCTL){ const c=PCTL[key];
      if(c.group || !c.show_if) continue;
      let ok=true;
      for(const dk in c.show_if){ const dc=PCTL[dk]; if(!dc){ ok=false; break; }
        const v = dc.kind==="toggle" ? dc.el.checked : dc.el.value;
        if(String(v)!==String(c.show_if[dk])){ ok=false; break; } }
      c.container.style.display = ok ? "" : "none";
    }
  }
  function liveLabel(key){ const c=PCTL[key]; if(!c||c.kind!=="slider") return;
    c.valEl.textContent = fmtVal(schemaByKey[key], c.el.value);
    if(key==="carrier_ghz") $("lamVal").textContent = (29.9792458/(+c.el.value)).toFixed(1)+" cm";
  }
  function readParams(){ const out={};
    for(const key in PCTL){ const c=PCTL[key]; if(c.group) continue;
      out[key] = c.kind==="toggle" ? c.el.checked : (c.kind==="select" ? c.el.value : +c.el.value); }
    return out;
  }
  function setParamLock(dis){ for(const key in PCTL){ const c=PCTL[key]; if(!c.group && c.el) c.el.disabled=dis; } $("speed").disabled=dis; }
  function postParams(){
    if(scanning) return;
    setStatus("recomputing…", true);
    fetch("/api/params",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(readParams())})
      .then(r=>r.json()).then(st=>{ applyState(st); afterLoad(); })
      .catch(()=>setStatus("offline"));
  }
  // A param changed. Fast scenes recompute live; backprojection scenes (walk)
  // hold params PENDING and never recompute until Begin scan is pressed.
  function queueParamUpdate(fast){
    if(scanning) return;
    if(S && S.backend==="backprojection"){ paramsDirty=true; setStatus("params changed — press Begin scan", false); return; }
    clearTimeout(paramTimer); paramTimer=setTimeout(postParams, fast?60:260);
  }
  // commit pending params to the server (rebuild) and resolve when done
  function commitParams(){
    return fetch("/api/params",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(readParams())})
      .then(r=>r.json()).then(st=>{ applyState(st); paramsDirty=false; });
  }

  // ---------- request scheduler ----------
  let pending=false, dirty=false, dirtyKind="slice", wantHol=false;
  function schedule(kind, hol){ if(hol) wantHol=true; if(kind==="recon") dirtyKind="recon"; dirty=true; pump(); }
  function pump(){
    if(pending || !dirty || !S) return;
    if(S.backend==="backprojection" && k<1){ dirty=false; setStatus("ready — press Begin scan", false); return; }
    pending=true; dirty=false; const kind=dirtyKind; dirtyKind="slice"; const hol=wantHol; wantHol=false;
    setStatus(scanning ? "scanning…" : "computing…", true);
    const url = kind==="recon"
      ? `/api/recon?mode=${mode}&zi=${zIndex}&k=${k}&hol=${hol?1:0}`
      : `/api/slice?mode=${mode}&zi=${zIndex}&k=${k}`;
    fetch(url).then(r=>r.json()).then(d=>{ if(d.error){ setStatus("error: "+d.error); return; } applyData(d, kind, hol); })
      .catch(()=>setStatus("offline"))
      .finally(()=>{ pending=false; if(dirty) pump(); else setStatus(scanning ? "scanning…" : "ready", false); });
  }
  function applyData(d, kind, hol){
    $("slice").src = "data:image/png;base64," + d.slice;
    if(kind==="recon"){
      profile = d.profile;
      if(d.sharpIndex!=null){ sharpIdx=d.sharpIndex; sharpX=d.sharpX; sharpY=d.sharpY;
        const isM = S && S.Lx>8;  // metres vs cm readout by scene scale
        $("sharpZval").textContent = d.sharpZ.toFixed(2)+" m";
        $("sharpXY").textContent = isM ? ("x "+d.sharpX.toFixed(1)+" · y "+d.sharpY.toFixed(1)+" m")
                                       : ("x "+(d.sharpX*100).toFixed(0)+" · y "+(d.sharpY*100).toFixed(0)+" cm");
        $("sharpXY").style.display = showSharp ? "block" : "none"; }
      if(hol && d.amp){ $("holoAmp").src="data:image/png;base64,"+d.amp; $("holoPhase").src="data:image/png;base64,"+d.phase; }
    }
    updateDepthReadout();
  }
  function updateDepthReadout(){
    if(!S) return;
    const z = S.z[Math.min(zIndex, S.z.length-1)];
    const zObj = S.geometry && S.geometry.zObject;
    const near = Math.abs(z-S.zEmitter)<0.05 ? " · emitter" : (zObj!=null && Math.abs(z-zObj)<0.05 ? " · object" : "");
    $("sliceTag").textContent = (mode==="dark" ? "dark-field · " : "") + "z = " + z.toFixed(2) + " m" + near;
    $("zval").textContent = z.toFixed(2)+" m";
    drawProfile();
  }

  // ---------- profile mini-plot ----------
  const profCv = $("profile");
  function drawProfile(){
    if(!S) return;
    const g=profCv.getContext("2d"), dpr=Math.min(devicePixelRatio||1,2);
    const w=profCv.clientWidth, h=profCv.clientHeight;
    profCv.width=w*dpr; profCv.height=h*dpr; g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
    if(!profile.length) return;
    const n=profile.length, pad=3, X=i=>pad+i/(n-1)*(w-2*pad), Yv=v=>h-pad-v*(h-2*pad);
    const zi=zt=>{ let bi=0,bd=1e9; S.z.forEach((z,i)=>{const dd=Math.abs(z-zt);if(dd<bd){bd=dd;bi=i;}}); return bi; };
    const marks=[[zi(S.zEmitter),COL.amber]];
    if(S.geometry && S.geometry.zObject!=null) marks.push([zi(S.geometry.zObject),COL.steel]);
    marks.forEach(([i,c])=>{ g.strokeStyle=c; g.globalAlpha=.4; g.lineWidth=1; g.beginPath(); g.moveTo(X(i),pad); g.lineTo(X(i),h-pad); g.stroke(); g.globalAlpha=1; });
    g.beginPath(); profile.forEach((v,i)=> i?g.lineTo(X(i),Yv(v)):g.moveTo(X(i),Yv(v)));
    g.strokeStyle=COL.cyanDim; g.lineWidth=1.6; g.stroke();
    g.lineTo(X(n-1),h-pad); g.lineTo(X(0),h-pad); g.closePath(); g.fillStyle="rgba(43,182,207,.12)"; g.fill();
    if(showSharp && sharpIdx!=null){ g.strokeStyle="#5ef08a"; g.lineWidth=1.6; g.setLineDash([4,3]);
      g.beginPath(); g.moveTo(X(sharpIdx),pad); g.lineTo(X(sharpIdx),h-pad); g.stroke(); g.setLineDash([]); }
    const mc={single:COL.cyan,white:COL.amber,dark:COL.magenta}[mode];
    g.strokeStyle=mc; g.lineWidth=1.5; g.beginPath(); g.moveTo(X(zIndex),pad); g.lineTo(X(zIndex),h-pad); g.stroke();
    g.fillStyle=mc; g.beginPath(); g.arc(X(zIndex),Yv(profile[zIndex]||0),3,0,7); g.fill();
  }

  // after loading new state: fast scenes auto-show the full reconstruction;
  // backprojection (walk) is expensive, so defer -> nothing computes until "Begin scan".
  function afterLoad(){
    if(S && S.backend==="backprojection"){
      k=0; profile=[]; sharpIdx=null; updateScanText();
      $("slice").src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==";
      $("sliceTag").textContent="press Begin scan";
      $("sharpZval").textContent=""; $("sharpXY").style.display="none";
      drawProfile(); setStatus("ready — press Begin scan", false);
    } else {
      k=S.total; updateScanText(); schedule("recon",true);
    }
  }

  // ---------- state load ----------
  function applyState(st){
    const sceneChanged = st.scene !== curScene;
    S = st; curScene = st.scene;
    if(sceneChanged){
      buildParamPanel(st.schema);
      $("sceneTitle").textContent = (st.scenes.find(s=>s.name===st.scene)||{}).label || "Live simulator";
      const sel=$("scene"); if(sel.value!==st.scene) sel.value=st.scene;
      // frame the camera to the scene scale
      const wd=(st.geometry&&st.geometry.walkDepth)||0;
      const maxDim=Math.max(st.Lx, st.Ly, st.zEmitter+wd);
      const tz = wd>0 ? (st.zEmitter-wd)/2 : st.zEmitter*0.45;
      target=[st.Lx/2, st.Ly/2, tz]; dist=maxDim*2.2;
      distMin=maxDim*0.35; distMax=maxDim*3.4;
      zIndex = (st.iObject!=null ? st.iObject : (st.iEmitter!=null ? st.iEmitter : Math.floor(st.z.length/2)));
    }
    if(zIndex > S.z.length-1) zIndex = Math.floor(S.z.length/2);
    $("depth").max = S.z.length-1; $("depth").value = zIndex;
    // sync control values from server params ONLY on scene change -- doing it on
    // every param update yanks the slider you're dragging (rubber-banding).
    if(sceneChanged){
      for(const key in PCTL){ const c=PCTL[key]; if(c.group || st.params[key]==null) continue;
        if(c.kind==="toggle") c.el.checked=!!st.params[key]; else { c.el.value=st.params[key]; liveLabel(key); } }
    }
    updateParamVisibility();
    // readouts
    $("lamVal").textContent = S.lambdaCm.toFixed(1)+" cm";
    $("ptsVal").textContent = (st.scene==="walk") ? (S.scanTotal+" samples") : (S.nxPts+" × "+S.nyPts+" = "+S.scanTotal);
    $("sharpLabel").textContent = (st.scene==="room"||st.scene==="walk") ? "Max sharpness (emitter)" : "Max sharpness (router)";
    // backprojection scenes (walk) have no recorded-plane hologram -> hide that section
    $("holoSection").style.display = (st.backend==="backprojection") ? "none" : "";
    // depth ticks
    const ticks=$("ticks"); ticks.innerHTML="";
    const addTick=(zt,txt)=>{ let bi=0,bd=1e9; S.z.forEach((z,i)=>{const dd=Math.abs(z-zt);if(dd<bd){bd=dd;bi=i;}});
      const s=document.createElement("span"); s.textContent=txt; s.style.left=(bi/(S.z.length-1)*100)+"%"; ticks.appendChild(s); };
    addTick(S.z[0],S.z[0].toFixed(1));
    if(S.geometry && S.geometry.zObject!=null) addTick(S.geometry.zObject,"obj");
    addTick(S.zEmitter, st.scene==="cross" ? "emit" : "floor");
    addTick(S.z[S.z.length-1],S.z[S.z.length-1].toFixed(1));
  }

  // ---------- scene select ----------
  function populateScenes(scenes){
    const sel=$("scene"); sel.innerHTML="";
    scenes.forEach(s=>{ const o=document.createElement("option"); o.value=s.name; o.textContent=s.label; sel.appendChild(o); });
    sel.addEventListener("change", ()=>{
      setStatus("loading scene…", true);
      fetch("/api/scene",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:sel.value})})
        .then(r=>r.json()).then(st=>{ applyState(st); afterLoad(); })
        .catch(()=>setStatus("offline"));
    });
  }

  // ---------- mode + depth + sharp ----------
  function setMode(m){ mode=m;
    ["single","white","dark"].forEach(x=>$("m-"+x).setAttribute("aria-pressed", m===x));
    schedule("recon",false);
  }
  $("m-single").onclick=()=>setMode("single");
  $("m-white").onclick=()=>setMode("white");
  $("m-dark").onclick=()=>setMode("dark");
  $("depth").addEventListener("input",e=>{ zIndex=+e.target.value; updateDepthReadout(); schedule("slice",false); });
  $("t-sharp").addEventListener("change",e=>{ showSharp=e.target.checked;
    $("sharpXY").style.display=(showSharp && sharpX!=null)?"block":"none"; drawProfile(); });

  // ---------- scan ----------
  const scanBtn=$("scanBtn"), scanBar=$("scanBar"), speed=$("speed");
  speed.addEventListener("input",()=>{ scanDur=+speed.value; $("speedVal").textContent=scanDur.toFixed(1)+" s"; });
  function updateScanText(){ if(!S) return;
    $("scanText").textContent = `${k} / ${S.total} points · ${scanning?"scanning":(k>=S.total?"complete":"idle")}`;
    scanBar.style.width=(S.total?100*k/S.total:0)+"%";
  }
  function startScan(){
    scanning=true; scanStart=performance.now(); k=0; scanBtn.textContent="Stop"; scanBtn.classList.add("stop"); setParamLock(true); lastReq=0;
  }
  scanBtn.onclick=()=>{
    if(!S) return;
    if(scanning){ scanning=false; k=S.total; scanBtn.textContent="Begin scan"; scanBtn.classList.remove("stop"); setParamLock(false); updateScanText(); schedule("recon",true); return; }
    // backprojection scenes: commit any pending param changes (rebuild) FIRST,
    // then scan -- this is the only place a param change takes effect.
    if(S.backend==="backprojection" && paramsDirty){
      setStatus("applying params…", true);
      commitParams().then(startScan).catch(()=>setStatus("offline"));
      return;
    }
    startScan();
  };

  // ---------- 3D scene ----------
  let target=[1.5,1.0,1.05], az=-0.72, el=0.34, dist=6.8, distMin=2.8, distMax=15;
  const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], dot3=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
  const crs=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
  const nrm=v=>{const m=Math.hypot(v[0],v[1],v[2])||1;return[v[0]/m,v[1]/m,v[2]/m];};
  let W=0,H=0,focal=600,eye=[0,0,0],right=[1,0,0],camUp=[0,1,0],fwd=[0,0,1];
  function cam(){ const ce=Math.cos(el),se=Math.sin(el),ca=Math.cos(az),sa=Math.sin(az);
    const dir=[ce*sa,se,ce*ca]; eye=[target[0]+dir[0]*dist,target[1]+dir[1]*dist,target[2]+dir[2]*dist];
    fwd=nrm(sub(target,eye)); right=nrm(crs(fwd,[0,1,0])); camUp=crs(right,fwd); focal=(H/2)/Math.tan((42*Math.PI/180)/2); }
  function proj(p){ const v=sub(p,eye),cz=dot3(v,fwd); if(cz<0.05)return null; return {x:W/2+dot3(v,right)*focal/cz,y:H/2-dot3(v,camUp)*focal/cz,depth:cz}; }
  function poly(pts,fill,stroke,lw){ const ps=pts.map(proj); if(ps.some(p=>!p))return; ctx.beginPath();
    ps.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.closePath();
    if(fill){ctx.fillStyle=fill;ctx.fill();} if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke();} }
  function seg(a,b,c,lw,al){ const pa=proj(a),pb=proj(b); if(!pa||!pb)return; ctx.globalAlpha=al==null?1:al;
    ctx.strokeStyle=c; ctx.lineWidth=lw||1; ctx.beginPath(); ctx.moveTo(pa.x,pa.y); ctx.lineTo(pb.x,pb.y); ctx.stroke(); ctx.globalAlpha=1; }
  function lbl(p,t,c,dx,dy){ const pp=proj(p); if(!pp)return; ctx.font="11px ui-monospace,Menlo,monospace"; ctx.fillStyle=c;
    ctx.textAlign="left"; ctx.textBaseline="middle"; ctx.fillText(t,pp.x+(dx||8),pp.y+(dy||0)); }
  function crossPoly(cx,cy,L,w,z){ return [[cx-w,cy+L],[cx+w,cy+L],[cx+w,cy+w],[cx+L,cy+w],[cx+L,cy-w],[cx+w,cy-w],
    [cx+w,cy-L],[cx-w,cy-L],[cx-w,cy-w],[cx-L,cy-w],[cx-L,cy+w],[cx-w,cy+w]].map(([x,y])=>[x,y,z]); }
  function inCross(x,y,cx,cy,L,w){ return (Math.abs(x-cx)<=L&&Math.abs(y-cy)<=w)||(Math.abs(y-cy)<=L&&Math.abs(x-cx)<=w); }
  // generic occluder footprint test (shared by shadow rays across all scenes)
  function occluderHit(o,x,y){
    if(o.kind==="cross") return inCross(x,y,o.cx,o.cy,o.L,o.w);
    if(o.kind==="rect")  return x>=o.x0 && x<=o.x1 && y>=o.y0 && y<=o.y1;
    return false;
  }
  function drawCrossSlab(cx,cy,L,w,zf,zb){
    const f=crossPoly(cx,cy,L,w,zf), b=crossPoly(cx,cy,L,w,zb), n=f.length, faces=[];
    for(let i=0;i<n;i++){ const j=(i+1)%n; faces.push({v:[f[i],f[j],b[j],b[i]], col:"rgba(104,116,132,0.95)"}); }
    faces.push({v:f, col:"rgba(178,191,207,0.97)"}); faces.push({v:b, col:"rgba(118,130,146,0.95)"});
    faces.forEach(fc=>{ let cx2=0,cy2=0,cz2=0; fc.v.forEach(p=>{cx2+=p[0];cy2+=p[1];cz2+=p[2];});
      fc.d=dot3(sub([cx2/fc.v.length,cy2/fc.v.length,cz2/fc.v.length],eye),fwd); });
    faces.sort((a,b2)=>b2.d-a.d); faces.forEach(fc=>poly(fc.v, fc.col, "rgba(197,206,221,0.45)", 1));
  }
  // reconstruction-volume lattice between the recording plane and the emitter.
  // Portable: driven only by common geometry (Lx, Ly, zEmitter) -> works for every scene.
  function drawScanMesh(Lx,Ly,zTop){
    const lin=(n,L)=>Array.from({length:n+1},(_,i)=>i/n*L);
    const xs=lin(9,Lx), ys=lin(7,Ly), zs=lin(11,zTop);
    const lc="rgba(120,180,210,0.20)";
    ys.forEach(y=>zs.forEach(z=>seg([0,y,z],[Lx,y,z],lc,1,1)));
    xs.forEach(x=>zs.forEach(z=>seg([x,0,z],[x,Ly,z],lc,1,1)));
    xs.forEach(x=>ys.forEach(y=>seg([x,y,0],[x,y,zTop],lc,1,1)));
    xs.forEach(x=>ys.forEach(y=>zs.forEach(z=>{ const p=proj([x,y,z]); if(p){ ctx.fillStyle="rgba(150,210,235,0.55)"; ctx.beginPath(); ctx.arc(p.x,p.y,1.3,0,7); ctx.fill(); } })));
  }

  const opt={recon:true,cone:true,rays:false,mesh:false,grid:true,spin:true};
  [["t-recon","recon"],["t-cone","cone"],["t-rays","rays"],["t-mesh","mesh"],["t-grid","grid"],["t-spin","spin"]].forEach(([id,key])=>{
    $(id).addEventListener("change",e=>opt[key]=e.target.checked); });

  let dragging=false,lx=0,ly=0;
  canvas.addEventListener("pointerdown",e=>{dragging=true;lx=e.clientX;ly=e.clientY;opt.spin=false;$("t-spin").checked=false;canvas.setPointerCapture(e.pointerId);});
  canvas.addEventListener("pointermove",e=>{ if(!dragging)return; az-=(e.clientX-lx)*.006; el+=(e.clientY-ly)*.006; el=Math.max(-1.45,Math.min(1.45,el)); lx=e.clientX; ly=e.clientY; });
  canvas.addEventListener("pointerup",()=>dragging=false);
  canvas.addEventListener("wheel",e=>{e.preventDefault(); dist=Math.max(distMin,Math.min(distMax,dist*(1+Math.sign(e.deltaY)*.08)));},{passive:false});
  function resize(){ const dpr=Math.min(devicePixelRatio||1,2); W=canvas.clientWidth; H=canvas.clientHeight; canvas.width=W*dpr; canvas.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); drawProfile(); }
  addEventListener("resize",resize);

  // multipath wall box -- portable across any scene that exposes geo.room + geo.multipath
  function pushMultipathWalls(pit, geo){
    if(!(geo.multipath && geo.room)) return;
    const R=geo.room;
    const walls=[
      [[R.x0,R.y0,R.zFront],[R.x0,R.y1,R.zFront],[R.x0,R.y1,R.zBack],[R.x0,R.y0,R.zBack]],
      [[R.x1,R.y0,R.zFront],[R.x1,R.y1,R.zFront],[R.x1,R.y1,R.zBack],[R.x1,R.y0,R.zBack]],
      [[R.x0,R.y0,R.zFront],[R.x1,R.y0,R.zFront],[R.x1,R.y0,R.zBack],[R.x0,R.y0,R.zBack]],
      [[R.x0,R.y1,R.zFront],[R.x1,R.y1,R.zFront],[R.x1,R.y1,R.zBack],[R.x0,R.y1,R.zBack]],
      [[R.x0,R.y0,R.zBack],[R.x1,R.y0,R.zBack],[R.x1,R.y1,R.zBack],[R.x0,R.y1,R.zBack]],
      [[R.x0,R.y0,R.zFront],[R.x1,R.y0,R.zFront],[R.x1,R.y1,R.zFront],[R.x0,R.y1,R.zFront]]];
    walls.forEach(q=>{ const c=[0,0,0]; q.forEach(p=>{c[0]+=p[0];c[1]+=p[1];c[2]+=p[2];}); c[0]/=4;c[1]/=4;c[2]/=4;
      pit.push({d:dot3(sub(c,eye),fwd), fn:()=>poly(q,"rgba(120,140,170,0.045)","rgba(130,155,195,0.30)",1)}); });
  }

  // scene-specific solid objects pushed into the depth-sorted plane list
  function sceneObjects(pit, geo){
    pushMultipathWalls(pit, geo);
    if(geo.kind==="cross"){
      const cc=geo.crossCenter, L=geo.armL, w=geo.armW, zObj=geo.zObject, Lx=geo.Lx, Ly=geo.Ly, T=geo.crossThickness||0;
      pit.push({d:dot3(sub([Lx/2,Ly/2,zObj],eye),fwd), fn:()=>{
        poly([[0,0,zObj],[Lx,0,zObj],[Lx,Ly,zObj],[0,Ly,zObj]],null,"rgba(154,167,187,0.14)",1);
        if(T>0.005) drawCrossSlab(cc[0],cc[1],L,w,zObj-T/2,zObj+T/2);
        else poly(crossPoly(cc[0],cc[1],L,w,zObj),"rgba(154,167,187,0.82)","#c3cedd",1.2);
        lbl([cc[0]+L,cc[1],zObj],"cross",COL.steel,10,-4); }});
    } else if(geo.kind==="walk"){
      const cc=geo.crossCenter, L=geo.armL, w=geo.armW, zObj=geo.zObject, Lx=geo.Lx, Ly=geo.Ly, T=geo.crossThickness||0;
      // cross object
      pit.push({d:dot3(sub([Lx/2,Ly/2,zObj],eye),fwd), fn:()=>{
        if(T>0.005) drawCrossSlab(cc[0],cc[1],L,w,zObj-T/2,zObj+T/2);
        else poly(crossPoly(cc[0],cc[1],L,w,zObj),"rgba(154,167,187,0.82)","#c3cedd",1.2);
        lbl([cc[0]+L,cc[1],zObj],"cross",COL.steel,10,-4); }});
      // walk mesh box (z: -walkDepth .. 0, behind the recording plane)
      const wz=-geo.walkDepth;
      const box=[[0,0,wz],[Lx,0,wz],[Lx,Ly,wz],[0,Ly,wz],[0,0,0],[Lx,0,0],[Lx,Ly,0],[0,Ly,0]];
      const edges=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
      pit.push({d:dot3(sub([Lx/2,Ly/2,wz/2],eye),fwd), fn:()=>{ edges.forEach(([a,b])=>seg(box[a],box[b],"rgba(185,140,255,0.28)",1,1));
        lbl([0,Ly,wz],"walk mesh","rgb(185,140,255)",6,-4); }});
    } else if(geo.kind==="room"){
      const Lx=geo.Lx, Ly=geo.Ly, hgt=geo.height;
      // building wireframe box (z=0 ceiling .. z=height floor)
      const box=[[0,0,0],[Lx,0,0],[Lx,Ly,0],[0,Ly,0],[0,0,hgt],[Lx,0,hgt],[Lx,Ly,hgt],[0,Ly,hgt]];
      const edges=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
      pit.push({d:dot3(sub([Lx/2,Ly/2,hgt/2],eye),fwd), fn:()=>{ edges.forEach(([a,b])=>seg(box[a],box[b],"rgba(130,155,195,0.28)",1,1)); }});
      // shelves (absorbing slabs)
      geo.shelves.forEach(s=>{ const [x0,y0,x1,y1,z]=s;
        pit.push({d:dot3(sub([(x0+x1)/2,(y0+y1)/2,z],eye),fwd), fn:()=>
          poly([[x0,y0,z],[x1,y0,z],[x1,y1,z],[x0,y1,z]],"rgba(154,167,187,0.55)","#c3cedd",1.2)}); });
    }
  }

  function frame(now){
    if(opt.spin&&!reduceMotion) az+=0.0032;
    cam(); ctx.clearRect(0,0,W,H);
    if(!S){ requestAnimationFrame(frame); return; }
    const t=now/1000, geo=S.geometry||{};
    const Lx=S.Lx, Ly=S.Ly, zEmit=S.zEmitter, EM=[...S.emitterXY,zEmit], REF=[...S.refXY,0];
    const reconZ=S.z[Math.min(zIndex,S.z.length-1)];

    if(scanning){
      const p=Math.min(1,(now-scanStart)/(scanDur*1000)); k=Math.round(p*S.total); updateScanText();
      if(now-lastReq>110){ lastReq=now; schedule("recon",true); }
      if(p>=1){ scanning=false; k=S.total; scanBtn.textContent="Begin scan"; scanBtn.classList.remove("stop"); setParamLock(false); updateScanText(); schedule("recon",true); }
    }
    const nxp=S.nxPts, nyp=S.nyPts, stot=S.scanTotal;
    const frac=stot?k/stot:0, srow=Math.min(nyp-1,Math.floor(frac*nyp)), scol=Math.floor(frac*stot)-srow*nxp;
    const boundaryY=(srow/nyp)*Ly;

    // depth-sorted planes/objects
    const pit=[];
    pit.push({d:dot3(sub([Lx/2,Ly/2,0],eye),fwd), fn:()=>poly([[0,0,0],[Lx,0,0],[Lx,Ly,0],[0,Ly,0]],"rgba(56,225,214,0.06)","rgba(56,225,214,0.5)",1.4)});
    sceneObjects(pit, geo);
    if(opt.recon){ const mc={single:"56,225,214",white:"255,181,69",dark:"255,93,158"}[mode];
      pit.push({d:dot3(sub([Lx/2,Ly/2,reconZ],eye),fwd), fn:()=>{ poly([[0,0,reconZ],[Lx,0,reconZ],[Lx,Ly,reconZ],[0,Ly,reconZ]],`rgba(${mc},0.10)`,`rgba(${mc},0.9)`,1.6);
        lbl([0,Ly,reconZ],"recon z="+reconZ.toFixed(2),`rgb(${mc})`,6,-6); }}); }
    if(showSharp && sharpIdx!=null && sharpIdx<S.z.length){ const sz=S.z[sharpIdx];
      pit.push({d:dot3(sub([Lx/2,Ly/2,sz],eye),fwd), fn:()=>{ poly([[0,0,sz],[Lx,0,sz],[Lx,Ly,sz],[0,Ly,sz]],"rgba(94,240,138,0.08)","rgba(94,240,138,0.9)",1.6);
        lbl([Lx,0,sz],"max sharpness z="+sz.toFixed(2),"rgb(94,240,138)",6,10); }}); }
    pit.sort((a,b)=>b.d-a.d).forEach(it=>it.fn());

    if(opt.cone) [[0,0,0],[Lx,0,0],[Lx,Ly,0],[0,Ly,0]].forEach(c=>seg(EM,c,"rgba(255,181,69,0.26)",1,1));
    if(opt.mesh) drawScanMesh(Lx,Ly,zEmit);
    // shadow rays: emitter -> plane; blocked where the ray crosses any occluder.
    // Generic over occluders (cross footprint / shelf rects) -> works for every scene.
    if(opt.rays){ const occ=geo.occluders||[]; const nxr=22, nyr=16;
      for(let iy=0;iy<nyr;iy++)for(let ix=0;ix<nxr;ix++){ const x=(ix+0.5)/nxr*Lx, y=(iy+0.5)/nyr*Ly;
        let blk=false;
        for(const o of occ){ const f=(zEmit-o.z)/zEmit, hx=EM[0]+(x-EM[0])*f, hy=EM[1]+(y-EM[1])*f;
          if(occluderHit(o,hx,hy)){ blk=true; break; } }
        seg(EM,[x,y,0],blk?"rgba(255,93,94,0.5)":"rgba(56,225,214,0.12)",blk?1.3:0.8,1); } }

    const items=[];
    const isWalk = geo.kind==="walk";
    if(opt.grid && !isWalk){ const sx=Math.ceil(nxp/40), sy=Math.ceil(nyp/28);
      for(let iy=0;iy<nyp;iy+=sy)for(let ix=0;ix<nxp;ix+=sx){ const X=(ix+0.5)/nxp*Lx, Y=(iy+0.5)/nyp*Ly; const p=proj([X,Y,0]); if(!p)continue;
        const acq = scanning ? (Y<=boundaryY) : (k>=stot);
        items.push({d:p.depth, fn:()=>{ const r=Math.max(1.1,8/p.depth);
          ctx.fillStyle=acq?"rgba(90,216,232,0.95)":"rgba(70,90,110,0.5)"; if(acq){ctx.shadowColor="rgba(56,225,214,0.8)";ctx.shadowBlur=4;}
          ctx.beginPath(); ctx.arc(p.x,p.y,r,0,7); ctx.fill(); ctx.shadowBlur=0; }}); } }
    if(isWalk){
      // the walk itself IS the scan: draw the acquired scan-antenna path + current pose
      const SP=geo.scanPath, N=SP.length, kacq=Math.min(N, Math.max(0, k||(k>=stot?N:0)));
      // scan-antenna trail (acquired bright cyan, remaining dim)
      for(let i=1;i<N;i++){ const a=SP[i-1], b=SP[i]; const acq=i<=kacq;
        seg(a,b, acq?"rgba(90,216,232,0.8)":"rgba(70,90,110,0.35)", acq?1.5:1, 1); }
      // acquired sample dots
      const stepDot=Math.ceil(N/60);
      for(let i=0;i<kacq;i+=stepDot){ const p=proj(SP[i]); if(!p) continue;
        items.push({d:p.depth, fn:()=>{ ctx.fillStyle="rgba(90,216,232,0.85)"; ctx.beginPath(); ctx.arc(p.x,p.y,1.6,0,7); ctx.fill(); }}); }
      // current scan antenna + ref antenna (at the current/last acquired step)
      const ci=Math.min(N-1, Math.max(0, (kacq>0?kacq-1:0)));
      const sp=proj(SP[ci]), rp=proj(geo.refPath[ci]), op=proj(geo.objPath[ci]);
      if(op) items.push({d:op.depth-0.0005, fn:()=>{ ctx.strokeStyle="rgba(234,242,255,0.5)"; ctx.lineWidth=1; const s2=proj(SP[ci]),r2=proj(geo.refPath[ci]);
        if(s2){ctx.beginPath();ctx.moveTo(op.x,op.y);ctx.lineTo(s2.x,s2.y);ctx.stroke();} if(r2){ctx.beginPath();ctx.moveTo(op.x,op.y);ctx.lineTo(r2.x,r2.y);ctx.stroke();}
        ctx.fillStyle="rgba(234,242,255,0.85)"; ctx.beginPath(); ctx.arc(op.x,op.y,3,0,7); ctx.fill(); }});
      if(sp) items.push({d:sp.depth-0.001, fn:()=>{ const h=ctx.createRadialGradient(sp.x,sp.y,0,sp.x,sp.y,13);
        h.addColorStop(0,"rgba(234,242,255,0.9)"); h.addColorStop(1,"rgba(234,242,255,0)"); ctx.fillStyle=h; ctx.beginPath(); ctx.arc(sp.x,sp.y,13,0,7); ctx.fill();
        ctx.fillStyle=COL.white; ctx.beginPath(); ctx.arc(sp.x,sp.y,3,0,7); ctx.fill(); }});
      if(rp) items.push({d:rp.depth-0.001, fn:()=>{ ctx.fillStyle=COL.magenta; ctx.beginPath(); ctx.arc(rp.x,rp.y,3.5,0,7); ctx.fill();
        ctx.strokeStyle="rgba(255,93,158,0.5)"; ctx.lineWidth=1.2; ctx.beginPath(); ctx.arc(rp.x,rp.y,7,0,7); ctx.stroke(); }});
    } else {
      if(scanning || (k>0 && k<stot)){ const ax=(scol+0.5)/nxp*Lx, ay=(srow+0.5)/nyp*Ly; const p=proj([ax,ay,0]);
        if(p) items.push({d:p.depth-0.001, fn:()=>{ const halo=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,15);
          halo.addColorStop(0,"rgba(234,242,255,0.9)"); halo.addColorStop(1,"rgba(234,242,255,0)");
          ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(p.x,p.y,15,0,7); ctx.fill();
          ctx.fillStyle=COL.white; ctx.beginPath(); ctx.arc(p.x,p.y,3.2,0,7); ctx.fill(); }}); }
      const p=proj(REF); if(p) items.push({d:p.depth-0.002, fn:()=>{ ctx.fillStyle=COL.magenta; ctx.beginPath(); ctx.arc(p.x,p.y,4,0,7); ctx.fill();
        ctx.strokeStyle="rgba(255,93,158,0.5)"; ctx.lineWidth=1.3; ctx.beginPath(); ctx.arc(p.x,p.y,8,0,7); ctx.stroke(); }}); }
    { const p=proj(EM); if(p){ const rad=Math.max(16,32*(6.8/Math.max(dist,1))); items.push({d:p.depth-0.003, fn:()=>{ const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,rad);
      g.addColorStop(0,"rgba(255,181,69,0.95)"); g.addColorStop(0.3,"rgba(255,122,47,0.55)"); g.addColorStop(1,"rgba(255,122,47,0)");
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,rad,0,7); ctx.fill(); ctx.fillStyle="#fff4e2"; ctx.beginPath(); ctx.arc(p.x,p.y,4.3,0,7); ctx.fill();
      const nr=reduceMotion?1:3; for(let i=0;i<nr;i++){ const ph=reduceMotion?0.5:((t*0.6+i/nr)%1);
        ctx.strokeStyle=`rgba(255,181,69,${0.5*(1-ph)})`; ctx.lineWidth=1.3; ctx.beginPath(); ctx.arc(p.x,p.y,6+ph*rad*1.2,0,7); ctx.stroke(); } }}); } }
    items.sort((a,b)=>b.d-a.d).forEach(it=>it.fn());

    if(showSharp && sharpIdx!=null && sharpX!=null){ const sz=S.z[sharpIdx]; const p=proj([sharpX,sharpY,sz]);
      if(p){ ctx.strokeStyle="#5ef08a"; ctx.lineWidth=1.6;
        ctx.beginPath(); ctx.moveTo(p.x-7,p.y); ctx.lineTo(p.x+7,p.y); ctx.moveTo(p.x,p.y-7); ctx.lineTo(p.x,p.y+7); ctx.stroke();
        ctx.beginPath(); ctx.arc(p.x,p.y,4,0,7); ctx.stroke(); } }
    lbl(EM, geo.kind==="room"?"emitter":"router", COL.amber, 12, -20);
    if(geo.kind!=="walk") lbl(REF,"ref",COL.magenta,11,10);
    requestAnimationFrame(frame);
  }

  // ---------- boot ----------
  resize();
  requestAnimationFrame(frame);
  fetch("/api/state").then(r=>r.json()).then(st=>{ populateScenes(st.scenes); applyState(st); afterLoad(); })
    .catch(()=>setStatus("server offline — start with  python3 run.py"));
})();
</script>
</body>
</html>
